[workspace]
resolver = "3"
members = ["super_orchestrator", "testcrate"]

[workspace.dependencies]
bollard = { version = "0.18" }
bstr = "1"
clap = { version = "4", features = ["derive", "env"] }
dunce = "1.0"
futures = { version = "0.3.31" }
nix = { version = "0.30", default-features = false, features = ["signal"] }
owo-colors = { version = "4.1", default-features = false }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
sha3 = "0.10"
stacked_errors = { version = "0.8", features = ["supports-color"] }
super_orchestrator = { path = "./super_orchestrator" }
tar = { version = "0.4.42" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
