[package]
name = "super_orchestrator"
version = "0.19.0"
edition = "2024"
# `flake.nix` and `ci.yml` read this automatically, but run `nix flake update`
# and fix any hashes. The pinned toolchain in `pinned-toolchain.toml` is
# bumped separately.
rust-version = "1.88"
authors = ["Aaron Kutch <aaronkutch@att.net>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/AaronKutch/super_orchestrator"
documentation = "https://docs.rs/super_orchestrator"
keywords = ["container", "docker"]
description = "programmable container orchestration tools"

[features]
default = []
# needed for Unix signals on `Command`s
nix_support = ["nix"]
# enable bollard backed features
bollard = ["dep:tar", "dep:bollard", "dep:futures"]

[dependencies]
bollard = { workspace = true, optional = true }
bstr = { workspace = true }
dunce = { workspace = true }
futures = { workspace = true, optional = true }
nix = { workspace = true, optional = true }
owo-colors = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha3 = { workspace = true }
stacked_errors = { workspace = true }
tar = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
